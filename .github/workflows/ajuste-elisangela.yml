name: Ajuste pontual do site Elisângela
on:
  push:
    paths:
      - '.github/workflows/ajuste-elisangela.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir-pagina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corrigir enquadramento da foto e botão da agenda
        shell: python
        run: |
          from pathlib import Path
          file = Path("index.html")
          source = file.read_text(encoding="utf-8")
          swaps = [
              ('.health-photo{margin-top:34px;width:100%;height:360px;object-fit:cover;border-radius:28px}',
               '.health-photo{margin-top:34px;width:100%;height:360px;object-fit:contain;object-position:center top;border-radius:28px;background:#234033}'),
              ('.agenda-preview .btn {margin-top:14px;min-width:230px;cursor:pointer;font:inherit;font-weight:700;}',
               '.agenda-preview .btn {width:100%;margin:12px 0 18px;min-width:0;font:inherit;font-weight:700;text-align:center;}'),
              ('<a class="btn btn-primary" href="/agenda/">Consulte a agenda</a>',
               '<button class="btn btn-primary" type="button" disabled aria-label="Consulta da agenda em construção" style="width:100%;margin:12px 0 18px;opacity:.75;cursor:not-allowed">Em construção</button>')
          ]
          for before, after in swaps:
              if source.count(before) != 1:
                  raise SystemExit(f"Trecho não único ou ausente: {before[:80]}")
              source = source.replace(before, after)
          file.write_text(source, encoding="utf-8")
      - name: Registrar alteração no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrigir foto e botão da agenda da Elisângela"
          git push
